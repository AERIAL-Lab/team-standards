name: 功能需求
description: 提议新功能或改进
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: checkboxes
    id: checks
    attributes:
      label: 提交前确认
      options:
        - label: 我填写了简短清晰的标题，能让他人在 Issue 列表里快速看懂大致内容
          required: true
        - label: 我已搜索现有 Issue 和 PR，确认这个需求没有被提过或正在做
          required: true

  - type: textarea
    id: problem
    attributes:
      label: 要解决的问题
      description: 用户在什么场景下遇到什么麻烦？先讲问题，再讲方案
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: 建议方案
      description: 有想法可以写，不知道如何实现可留空；实施前由负责人协助将大需求拆成可独立审核的小任务
    validations:
      required: false

  - type: textarea
    id: acceptance
    attributes:
      label: 验收标准
      description: 怎样算做完？列 2~4 条可验证的标准——这是给实现者（包括 coding agent）和 reviewer 用的
      placeholder: |
        - [ ]
        - [ ]
    validations:
      required: true

  - type: textarea
    id: additional
    attributes:
      label: 其他内容
      description: 相关背景、参考资料、截图等
    validations:
      required: false
