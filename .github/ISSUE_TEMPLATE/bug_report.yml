name: Bug 报告
description: 报告一个缺陷或异常行为
title: "[Bug] "
labels: ["bug"]
body:
  - type: checkboxes
    id: checks
    attributes:
      label: 提交前确认
      description: 勾选已完成的事项；最新代码验证为选填
      options:
        - label: 我填写了简短清晰的标题，而不是"出问题了"、"帮忙看看"这类标题
          required: true
        - label: 我已搜索现有 Issue（包括已关闭的），确认这个问题没有被报告过
          required: true
        - label: 我已在最新代码上验证，问题仍然存在（选填）
          required: false

  - type: textarea
    id: describe
    attributes:
      label: 问题描述
      description: 发生了什么？你期望的行为是什么？
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: 复现步骤
      description: 写出已知触发步骤；偶发问题请说明发生场景、频率和已尝试的操作，不要求先找到稳定复现方法
      placeholder: |
        1.
        2.
        3.
    validations:
      required: true

  - type: textarea
    id: environment
    attributes:
      label: 环境信息
      description: 填写实际出现问题的版本号或提交编号，以及相关环境；暂时无法确认版本时说明获取来源。最新代码验证为选填，不影响报告问题
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: 日志与截图
      description: 报错日志、截图或录屏。注意脱敏——不要贴密钥、Token、用户数据
      render: shell
    validations:
      required: false

  - type: textarea
    id: others
    attributes:
      label: 补充信息
      description: 任何其他有助于定位问题的信息
    validations:
      required: false
